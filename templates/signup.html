<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OTP Code</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
  <div class="container">
      
      <hr>
      
      <div class="col-md-8 offset-2">
      
          <div class="card">
          <div class="card-header">
              <h1 class="text-center">Register</h1>
              <div class="card-body">
                <form method="post">
                   {% csrf_token %}
                    
                    <div class="input-group mb-3">
                        <input class="form-control" type="email" name="email" placeholder="Enter email">
                    </div>
                    
                    <div class="input-group mb-3">
                        <input class="form-control" type="password" name="password1" placeholder="Enter password">
                    </div>
                    
                     <div class="input-group mb-3">
                        <input class="form-control" type="password" name="password2" placeholder="Enter confirm passowrd">
                    </div>
                    
                    
                 
                        <button class="btn btn-primary align-self-center">  Submit   </button>
                 
                   
                </form>
                  <p>Already have an account ..? <a href="{% url 'login' %}">Login</a> </p>
              </div>
          </div>
         </div>
      </div>
      
  </div>
  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
